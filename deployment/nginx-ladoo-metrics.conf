# Nginx configuration for Ladoo Metrics
# Place this file at: /etc/nginx/sites-available/ladoo-metrics
# Then create symlink: ln -s /etc/nginx/sites-available/ladoo-metrics /etc/nginx/sites-enabled/
# Remove default: rm /etc/nginx/sites-enabled/default
# Test: nginx -t
# Reload: systemctl reload nginx

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

# Upstream backend
upstream ladoo_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

# Detect frontend SPA routes: GET requests to paths that are React Router pages.
# These should serve index.html instead of being proxied to the backend API.
# Only exact URI matches are listed (sub-paths like /functions/test stay 0 → proxied).
map $request_method:$uri $is_frontend_route {
    default                0;
    "GET:/insights"        1;
    "GET:/functions"       1;
    "GET:/discover"        1;
    "GET:/reports"         1;
    "GET:/dashboard"       1;
    "GET:/settings"        1;
    "GET:/login"           1;
}

# HTTP server
# Accept requests for the domain and also from load balancers/reverse proxies
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name laddoo.labs.plectrum.dev _;

    # Logging
    access_log /var/log/nginx/ladoo-metrics-access.log;
    error_log /var/log/nginx/ladoo-metrics-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Large file uploads (5GB support)
    client_max_body_size 5G;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # Frontend static files
    root /opt/ladoo-metrics/frontend/dist;
    index index.html;

    # Upload endpoints - stricter rate limiting
    location ~ ^/upload {
        limit_req zone=upload_limit burst=5 nodelay;

        proxy_pass http://ladoo_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        # Timeouts for long-running uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # API endpoints - proxy to backend
    location ~ ^/(meta|metrics|funnel|session|statistical-test|captain-level-aggregation|funnel-analysis|captain-dashboards|report|functions|data|calculated-columns|discover|pivot|insights|health) {
        # SPA fix: when a browser reloads a frontend page (GET /insights, GET /functions, etc.)
        # serve index.html so React Router handles the route client-side.
        # POST / sub-path API calls (e.g. POST /insights, GET /functions/template) are unaffected.
        if ($is_frontend_route) {
            rewrite ^ /index.html last;
        }

        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://ladoo_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        # Timeouts for long-running Presto queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Frontend static files
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://ladoo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
