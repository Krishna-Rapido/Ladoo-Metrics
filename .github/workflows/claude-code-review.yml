name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

          # Design system guardrails for code review.
          # These args inject additional review instructions so the reviewer
          # flags risky changes to protected design system files.
          claude_args: |
            --append-system-prompt "DESIGN SYSTEM REVIEW RULES — apply these when reviewing PRs:
            1. Flag as HIGH RISK any modifications to: frontend/src/styles/globals.css, frontend/tailwind.config.js, frontend/src/components/ui/*, frontend/src/lib/utils.ts. These are protected design system files — changes affect every page.
            2. Flag as VIOLATION any new inline style={{ color/backgroundColor/borderColor }} using hardcoded hex values for theme colors. The correct approach is Tailwind classes mapped to CSS variables (bg-background, text-foreground, border-border, etc.).
            3. Flag as WARNING any new hardcoded hex colors (#xxxxxx) in component files outside of chart COLORS arrays in ChartBuilder.tsx, DiscoverVisualization.tsx, CaptainLevelCharts.tsx, or computeExecutiveSummary.ts.
            4. Flag as CONCERN any visual/styling changes that are NOT scoped to the specific component or page mentioned in the PR description.
            5. Consult DESIGN_SYSTEM.md at the repo root for the complete color token reference."

