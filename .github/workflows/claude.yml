name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  # Triggered by @claude mentions in issues/PRs
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read

  # Triggered by slack-request label (from Slack bot pipeline)
  claude-slack:
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'slack-request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code for Slack Request
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          prompt: |
            You are implementing a change requested via Slack for the Ladoo Metrics platform.
            The issue was created automatically from a Slack message in #ladoo-requests.

            ## Instructions
            1. Create a new branch named `slack/${{ github.event.issue.number }}-fix` from main
            2. Read the issue description carefully and implement the requested change
            3. Run the backend tests: `cd backend && python -m pytest tests/ -v --tb=short`
            4. Run the frontend build: `cd frontend && npm ci && npm run build`
            5. If tests/build fail, fix the issues before proceeding
            6. Create a PR with title matching the issue title
            7. Include `Closes #${{ github.event.issue.number }}` in the PR body so it auto-closes the issue on merge
            8. NEVER commit directly to main — always use a feature branch and PR

            ## Context
            - Backend: FastAPI app in `backend/` — run tests with `python -m pytest tests/ -v`
            - Frontend: React+Vite app in `frontend/` — verify with `npm run build`
            - Read CLAUDE.md for full architecture details
